name: Check workflows
on:
  pull_request:
    paths: [".github/workflows/**", "actions/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**", "actions/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Check workflows and Bash
        run: '"$RUNNER_TEMP/actionlint" .github/workflows/*.yml'
      - name: Set up Dalamud libraries
        uses: ./actions/setup-dalamud
