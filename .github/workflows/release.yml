# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Release"

on:
  workflow_call:
    inputs:
      language:
        description: "The [target.*] suffix: es-es, it, pt-br, pl."
        required: true
        type: string
    secrets:
      CI_READ_TOKEN:
        required: true
      CI_MERGE_TOKEN:
        description: "A token of a person with write on this repository: commits coverage.json after the release."
        required: true

permissions: {}

# One release at a time per language, in order: a second merge waits for the first release rather
# than racing it for the `latest` slot.
concurrency:
  group: "release-${{ inputs.language }}"
  cancel-in-progress: false

jobs:
  release:
    name: "Build and publish the pack"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      # Actions pinned by commit: a tag can be moved, a commit cannot.
      # Full history: the release notes list the commits since the previous release's corpusCommit.
      - name: "Checkout the language repository"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
        with:
          fetch-depth: 0
          path: "pack"
          persist-credentials: false

      - name: "Checkout the English corpus"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
        with:
          repository: "ashdam/ffxiv-corpus-en"
          path: "corpus-en"
          token: "${{ secrets.CI_READ_TOKEN }}"
          persist-credentials: false

      - name: "Checkout the tools"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
        with:
          repository: "ashdam/corpus-extractor"
          path: "Tools"
          token: "${{ secrets.CI_READ_TOKEN }}"
          persist-credentials: false

      # The game's Excel files, exported with `CorpusExtractor --export-sheets` after every patch.
      - name: "Checkout the game sheets"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
        with:
          repository: "ashdam/ffxiv-game-sheets"
          path: "game-sheets"
          token: "${{ secrets.CI_READ_TOKEN }}"
          persist-credentials: false

      - name: "Set up .NET"
        uses: "actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9" # v4
        with:
          dotnet-version: "10.0.x"

      # Lumina, the same build Dalamud ships, which the tools reference from a local install.
      # Keep the archive revision and hash in sync.
      - name: "Fetch Dalamud"
        shell: "pwsh"
        env:
          DALAMUD_SHA256: "2343ab848def4f749a8b7ecf9a139e82f38801a8f631f6b55caf748c768aab4c"
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/goatcorp/dalamud-distrib/86761b0e692b0346c9fe41fa96bdd0dd766f9b6f/latest.zip' -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          $hash = (Get-FileHash "$env:RUNNER_TEMP/dalamud.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DALAMUD_SHA256) { throw "Dalamud archive hash $hash is not the pinned one. Check the Dalamud release, then update DALAMUD_SHA256." }
          Expand-Archive -Path "$env:RUNNER_TEMP/dalamud.zip" -DestinationPath "$env:RUNNER_TEMP/dalamud" -Force
          "DalamudLibPath=$env:RUNNER_TEMP/dalamud/" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The runner's tools.ini: the same keys the tools read on a workstation, with the runner's paths.
      - name: "Write tools.ini"
        shell: "pwsh"
        env:
          LANGUAGE: "${{ inputs.language }}"
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $upper = $env:LANGUAGE.ToUpperInvariant()
          $ini = @(
            '[common]',
            "game   = $ws/game-sheets",
            "source = $ws/corpus-en",
            '',
            "[target.$env:LANGUAGE]",
            "dir = $ws/pack",
            "out = $ws/build/Gubal Library ($upper)",
            '',
            '[CorpusExtractor]',
            "excluded = $ws/Tools/excluded-rows.json",
            '',
            '[PackBuilder]',
            "inventory = $ws/Tools/LocalizationKit/LocalizationKit.csproj"
          )
          Set-Content -Path "$ws/Tools/tools.ini" -Value $ini -Encoding utf8
          New-Item -ItemType Directory -Force "$ws/build" | Out-Null

      # A corpus behind the game is not built: the plugin would refuse the pack by gameVersion, and
      # a page built against other rows would be worse than a refusal.
      - name: "Check the corpus is in step with the game"
        shell: "pwsh"
        env:
          LANGUAGE: "${{ inputs.language }}"
        run: |
          dotnet run --project Tools/CorpusExtractor -c Release -- --language $env:LANGUAGE --sync-target --dry-run --strict
          if ($LASTEXITCODE -ne 0) { throw "The corpus needs a sync before it can be released." }

      - name: "Build the pack"
        shell: "pwsh"
        env:
          LANGUAGE: "${{ inputs.language }}"
        run: |
          Tools/build-pack.ps1 -Language $env:LANGUAGE
          if ($LASTEXITCODE -ne 0) { throw "The build stopped." }

      - name: "Verify packaged ULD files"
        shell: "pwsh"
        env:
          LANGUAGE: "${{ inputs.language }}"
        run: |
          $pack = Get-Content pack/pack.json -Raw | ConvertFrom-Json
          $repo = ($pack.repo -split '/')[-1]
          $archive = Join-Path "$env:GITHUB_WORKSPACE/build" "$repo.zip"
          dotnet run --project Tools/PackBuilder -c Release -- --language $env:LANGUAGE --verify-pack-layouts $archive
          if ($LASTEXITCODE -ne 0) { throw 'The archive does not contain the validated ULD files.' }

      - name: "Publish the release"
        shell: "pwsh"
        env:
          LANGUAGE: "${{ inputs.language }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          Tools/publish-pack.ps1 -Language $env:LANGUAGE

      # The build leaves the coverage document beside the archive; it goes into the language
      # repository as coverage.json, where the web reads it. Committed with a person's token: the
      # workflow token cannot pass the branch rule. The file is outside the paths that start a
      # release, so this push starts none.
      - name: "Commit the coverage"
        shell: "bash"
        working-directory: "pack"
        env:
          TOKEN: "${{ secrets.CI_MERGE_TOKEN }}"
          LANGUAGE: "${{ inputs.language }}"
        run: |
          cp "../build/ffxiv-language-pack-${LANGUAGE}.coverage.json" coverage.json
          if git diff --quiet -- coverage.json && [ -n "$(git ls-files coverage.json)" ]; then
            echo "coverage.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -m "coverage.json"
          # main may have moved during the build: a merge that landed meanwhile must not fail the release.
          git pull --rebase "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
