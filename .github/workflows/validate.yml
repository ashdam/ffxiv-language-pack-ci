# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Validate"

on:
  workflow_call:
    inputs:
      language:
        description: "The [target.*] suffix: es-es, it, pt-br, pl."
        required: true
        type: string
    secrets:
      CI_READ_TOKEN:
        required: false

permissions: {}

jobs:
  validate:
    name: "Validate the changed rows"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      pull-requests: "write"
    steps:
      # Actions pinned by commit: a tag can be moved, a commit cannot.
      # The pull request is checked out as data. Nothing in it is executed: the script comes from
      # this repository.
      - name: "Checkout the pull request"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Checkout the workflow scripts"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
        with:
          repository: "ashdam/ffxiv-language-pack-ci"
          path: ".ci"
          persist-credentials: false

      # The English rows the macro check compares against. Shallow: the history is not needed.
      - name: "Checkout the English corpus"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
        with:
          repository: "ashdam/ffxiv-corpus-en"
          path: ".corpus-en"
          token: "${{ secrets.CI_READ_TOKEN || github.token }}"
          persist-credentials: false

      - name: "Check the rows"
        shell: "bash"
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          bash .ci/scripts/validate-pr.sh "$BASE_SHA" "$HEAD_SHA" .corpus-en validate-report.md

      # The summary shows on every run. The comment needs a write token, which a fork's run does not get.
      - name: "Report the result"
        if: "always()"
        shell: "bash"
        run: |
          if [ -s validate-report.md ]; then cat validate-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: "Comment the result"
        if: "always() && github.event_name == 'pull_request'"
        continue-on-error: true
        shell: "bash"
        env:
          GH_TOKEN: "${{ github.token }}"
          PR: "${{ github.event.pull_request.number }}"
        run: |
          if [ -s validate-report.md ]; then
            gh pr comment "$PR" --body-file validate-report.md --repo "$GITHUB_REPOSITORY"
          fi
