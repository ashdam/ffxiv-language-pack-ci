# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Validate"

on:
  workflow_call:
    inputs:
      language:
        description: "The [target.*] suffix: es-es, it, pt-br, pl."
        required: false
        type: string
      rules:
        description: "Comma-separated rules for manual runs. Empty uses the CI rule list."
        required: false
        type: string
        default: ""
    secrets:
      CI_READ_TOKEN:
        required: false

permissions: {}

concurrency:
  group: validate-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate paths and corpus"
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    permissions:
      contents: "read"
      pull-requests: "write"
    steps:
      # Actions pinned by commit: a tag can be moved, a commit cannot.
      # The pull request is checked out as data. Nothing in it is executed: the script comes from
      # this repository.
      - name: "Checkout the language pack"
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false

      - name: "Checkout the workflow scripts"
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5
        with:
          repository: "ashdam/ffxiv-language-pack-ci"
          path: ".ci"
          persist-credentials: false

      - name: "Check path restrictions"
        if: github.event_name == 'pull_request'
        shell: "bash"
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          set -euo pipefail
          base=$BASE_SHA
          head=$HEAD_SHA
          report="path-report.md"
          repo=.
          base=$(git -C "$repo" rev-parse --verify "$base^{commit}")
          head=$(git -C "$repo" rev-parse --verify "$head^{commit}")
          base=$(git -C "$repo" merge-base "$base" "$head")
          problems=()
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            kind=${status:0:1}
            if [[ $kind = R || $kind = C ]]; then
              IFS= read -r -d '' path
            fi
            if [[ $kind == D ]]; then continue; fi
            mode=$(git -C "$repo" ls-tree "$head" -- "$path")
            if [[ ${mode%% *} != 100644 ]]; then
              problems+=("Data must be a regular non-executable file: $path")
            fi
          done < <(git -C "$repo" diff --name-status -z --find-renames "$base" "$head" --)
          if ((${#problems[@]})); then
            printf '**Path restrictions failed.**\n\n' > "$report"
            printf '%s\n' "${problems[@]}" >> "$report"
            cat "$report"
            exit 1
          fi
          printf 'Changed paths satisfy the repository restrictions.\n' > "$report"

      - name: Read pack identity
        shell: bash
        env:
          EXPECTED_LANGUAGE: "${{ inputs.language }}"
        run: |
          language=$(jq -er '.language | ascii_downcase' pack.json)
          [[ "$language" =~ ^[a-z]{2,3}(-[a-z0-9]{2,8})*$ ]]
          [[ -z "$EXPECTED_LANGUAGE" || "$EXPECTED_LANGUAGE" == "$language" ]]
          [[ $(jq -er .repo pack.json) == "$GITHUB_REPOSITORY" ]]
          [[ "$GITHUB_REPOSITORY" == */ffxiv-language-pack-"$language" ]]
          printf 'LANGUAGE=%s\n' "$language" >> "$GITHUB_ENV"

      # The English rows the macro check compares against. Shallow: the history is not needed.
      - name: "Checkout the English corpus"
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5
        with:
          repository: "ashdam/ffxiv-corpus-en"
          path: ".corpus-en"
          token: "${{ secrets.CI_READ_TOKEN || github.token }}"
          persist-credentials: false

      - name: "Checkout the tools"
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
        with:
          repository: "ashdam/corpus-extractor"
          ref: "main"
          path: ".tools"
          token: "${{ secrets.CI_READ_TOKEN || github.token }}"
          persist-credentials: false

      - name: "Checkout original banner texture metadata"
        id: game-sheets
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
        with:
          repository: "ashdam/ffxiv-game-sheets"
          ref: "main"
          path: ".game-sheets"
          token: "${{ secrets.CI_READ_TOKEN || github.token }}"
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ffxivgame.ver
            /metadata/banner-textures.json

      - name: "Set up .NET"
        uses: "actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1"
        with:
          dotnet-version: "10.0.402"

      - name: "Validate content"
        id: content-validation
        env:
          BASE_REF: "${{ github.event.pull_request.base.sha || format('refs/remotes/origin/{0}', github.event.repository.default_branch) }}"
          REQUESTED_RULES: "${{ github.event_name == 'workflow_dispatch' && inputs.rules || '' }}"
          VALIDATOR_RULES: >-
            lp-structure-json,
            lp-structure-file-identity,
            lp-structure-unique-game-key,
            lp-structure-delivery-metadata,
            lp-structure-glossary,
            lp-structure-game-version-unique,
            lp-structure-game-version-match,
            lp-structure-row-alignment,
            lp-inventory-exclusions,
            lp-structure-inventory-exclusion-hashes,
            lp-structure-inventory-excluded-translations,
            lp-structure-validator-reviews,
            lp-macros-syntax,
            lp-macros-speaker-label,
            lp-macros-icons,
            lp-terminology-drift-items,
            lp-terminology-drift-bnpcname,
            lp-terminology-drift-fates,
            lp-terminology-drift-placenames,
            lp-terminology-drift-creature-families,
            lp-textures-banners-format,
            lp-textures-banners-variants,
            lp-textures-banners-dimensions
        run: |
          rules="$VALIDATOR_RULES"
          if [[ -n "${REQUESTED_RULES//[[:space:]]/}" ]]; then
            rules="$REQUESTED_RULES"
          fi
          report="validate-report-$(date -u +'%Y-%m-%d_%H-%M-%SZ')"
          printf 'report-name=%s\n' "$report" >> "$GITHUB_OUTPUT"
          baseline="$RUNNER_TEMP/corpus-baseline"
          archive="$RUNNER_TEMP/corpus-baseline.tar"
          mkdir -p "$baseline"
          git archive --format=tar --output="$archive" "$BASE_REF"
          tar -xf "$archive" -C "$baseline"
          config="$RUNNER_TEMP/validator.ini"
          {
            printf '[common]\nsource = %s/.corpus-en\n' "$GITHUB_WORKSPACE"
            printf 'sheets = %s/.game-sheets\n' "$GITHUB_WORKSPACE"
            printf '[target.%s]\ndir = %s\n' "$LANGUAGE" "$GITHUB_WORKSPACE"
            printf '[CorpusExtractor]\nexcluded = %s/.corpus-en/config/excluded-rows.json\n' "$GITHUB_WORKSPACE"
          } > "$config"
          FF14_TOOLS_CONFIG="$config" dotnet run --project .tools/CorpusValidator -c Release -- \
            --lp "$GITHUB_WORKSPACE" \
            --rules "$rules" \
            --baseline "$baseline" \
            --json "$report.json" \
            --markdown validate-report.md

      - name: "Checkout the game sheets"
        if: github.event_name == 'pull_request'
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
        with:
          repository: "ashdam/ffxiv-game-sheets"
          ref: "${{ steps.game-sheets.outputs.commit }}"
          path: ".game-sheets"
          token: "${{ secrets.CI_READ_TOKEN || github.token }}"
          persist-credentials: false

      - name: "Set up Dalamud libraries"
        if: github.event_name == 'pull_request'
        uses: ./.ci/actions/setup-dalamud

      - name: "Build the pack"
        id: pack-build
        if: github.event_name == 'pull_request'
        run: |
          config="$RUNNER_TEMP/pack-builder.ini"
          build="$RUNNER_TEMP/pack-build"
          {
            printf '[common]\ngame = %s/.game-sheets\nsource = %s/.corpus-en\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
            printf '[target.%s]\ndir = %s\nout = %s/Gubal Library (%s)\n' "$LANGUAGE" "$GITHUB_WORKSPACE" "$build" "${LANGUAGE^^}"
            printf '[CorpusExtractor]\nexcluded = %s/.corpus-en/config/excluded-rows.json\n' "$GITHUB_WORKSPACE"
            printf '[PackBuilder]\ninventory = %s/.tools/LocalizationKit/LocalizationKit.csproj\n' "$GITHUB_WORKSPACE"
          } > "$config"
          export FF14_TOOLS_CONFIG="$config"
          mkdir -p "$build"
          dotnet run --project .tools/PackBuilder -c Release -- --language "$LANGUAGE"
          dotnet run --project .tools/PackBuilder -c Release -- --language "$LANGUAGE" --verify-pack-layouts "$build/${GITHUB_REPOSITORY##*/}.zip"

      - name: "Upload the JSON report"
        id: report-artifact
        if: "always() && steps.content-validation.outputs.report-name != '' && hashFiles(format('{0}.json', steps.content-validation.outputs.report-name)) != ''"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.content-validation.outputs.report-name }}
          path: ${{ steps.content-validation.outputs.report-name }}.json
          if-no-files-found: error

      # The summary shows on every run. The comment needs a write token, which a fork's run does not get.
      - name: "Report the result"
        if: "always()"
        shell: "bash"
        env:
          ARTIFACT_URL: ${{ steps.report-artifact.outputs.artifact-url }}
          PACK_BUILD: ${{ steps.pack-build.outcome }}
        run: |
          summary="$RUNNER_TEMP/validate-summary.md"
          : > "$summary"
          if [ -s validate-report.md ]; then
            awk '/^\|/ { print }' validate-report.md > "$summary"
          fi
          case "$PACK_BUILD" in
            success) printf '\nPackBuilder passed.\n' >> "$summary" ;;
            failure) printf '\nPackBuilder failed. See the workflow log.\n' >> "$summary" ;;
          esac
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Full report (ZIP)](%s)\n' "$ARTIFACT_URL" >> "$summary"
          fi
          for report in path-report.md "$summary"; do
            if [ -s "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: "Comment the result"
        if: "always() && github.event_name == 'pull_request'"
        continue-on-error: true
        shell: "bash"
        env:
          GH_TOKEN: "${{ github.token }}"
          PR: "${{ github.event.pull_request.number }}"
        run: |
          if [ -s "$RUNNER_TEMP/validate-summary.md" ]; then
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/validate-summary.md" --repo "$GITHUB_REPOSITORY"
          fi
