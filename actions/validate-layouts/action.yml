name: "Validate ULD layouts"
description: "Validate layouts. Requires .tools with PackBuilder and .NET 10."
inputs:
  language:
    required: true
    description: "Language suffix in tools.ini."
  read-token:
    required: true
    description: "Read access to the tools and game-file repositories."
runs:
  using: "composite"
  steps:
    - name: "Find layout definitions"
      id: layouts
      shell: bash
      run: |
        if [ -d layouts ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; fi

    - name: "Checkout the original game files"
      if: steps.layouts.outputs.present == 'true'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ashdam/ffxiv-game-sheets
        path: .layout-source
        token: ${{ inputs.read-token }}
        persist-credentials: false

    - name: "Fetch Lumina"
      if: steps.layouts.outputs.present == 'true'
      shell: pwsh
      env:
        DALAMUD_SHA256: 2343ab848def4f749a8b7ecf9a139e82f38801a8f631f6b55caf748c768aab4c
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'layout-dalamud.zip'
        Invoke-WebRequest 'https://raw.githubusercontent.com/goatcorp/dalamud-distrib/86761b0e692b0346c9fe41fa96bdd0dd766f9b6f/latest.zip' -OutFile $zip
        if ((Get-FileHash $zip).Hash.ToLowerInvariant() -ne $env:DALAMUD_SHA256) { throw 'Dalamud archive hash mismatch.' }
        Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/layout-dalamud" -Force

    - name: "Validate layout changes"
      if: steps.layouts.outputs.present == 'true'
      shell: pwsh
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        $config = Join-Path $env:RUNNER_TEMP 'layouts.ini'
        @(
          '[common]'
          "game = $env:GITHUB_WORKSPACE/.layout-source"
          "source = $env:GITHUB_WORKSPACE"
          "[target.$env:LANGUAGE]"
          "dir = $env:GITHUB_WORKSPACE"
          "out = $env:RUNNER_TEMP/layout-output"
        ) | Set-Content -LiteralPath $config
        $env:FF14_TOOLS_CONFIG = $config
        dotnet run --project .tools/PackBuilder -c Release "-p:DalamudLibPath=$env:RUNNER_TEMP/layout-dalamud/" -- --language $env:LANGUAGE --verify-layouts
        if ($LASTEXITCODE -ne 0) { throw 'ULD layout validation failed.' }
