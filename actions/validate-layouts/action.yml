name: "Validate ULD layouts"
description: "Validate layouts. Requires .tools with PackBuilder and .NET 10."
inputs:
  language:
    required: true
    description: "Language suffix in tools.ini."
  read-token:
    required: true
    description: "Read access to the tools and game-file repositories."
runs:
  using: "composite"
  steps:
    - name: "Find layout definitions"
      id: layouts
      shell: bash
      run: |
        if [ -d layouts ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; fi

    - name: "Checkout the original game files"
      if: steps.layouts.outputs.present == 'true'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ashdam/ffxiv-game-sheets
        path: .layout-source
        token: ${{ inputs.read-token }}
        persist-credentials: false

    - name: "Set up Dalamud libraries"
      if: steps.layouts.outputs.present == 'true'
      uses: ./.ci/actions/setup-dalamud

    - name: "Validate layout changes"
      if: steps.layouts.outputs.present == 'true'
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        config="$RUNNER_TEMP/layouts.ini"
        {
          printf '[common]\ngame = %s/.layout-source\nsource = %s\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE"
          printf '[target.%s]\ndir = %s\nout = %s/layout-output\n' "$LANGUAGE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
        } > "$config"
        FF14_TOOLS_CONFIG="$config" dotnet run --project .tools/PackBuilder -c Release -- --language "$LANGUAGE" --verify-layouts
