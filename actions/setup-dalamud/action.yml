name: Set up Dalamud libraries
description: Verify and prepare the pinned Dalamud runtime for .NET tools.
runs:
  using: composite
  steps:
    - name: Restore Dalamud libraries
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/dalamud
        key: dalamud-runtime-${{ runner.os }}-2343ab848def4f749a8b7ecf9a139e82f38801a8f631f6b55caf748c768aab4c
    - name: Download Dalamud libraries
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DALAMUD_SHA256: 2343ab848def4f749a8b7ecf9a139e82f38801a8f631f6b55caf748c768aab4c
      run: |
        archive="$RUNNER_TEMP/dalamud.zip"
        curl --fail --location --retry 3 'https://raw.githubusercontent.com/goatcorp/dalamud-distrib/86761b0e692b0346c9fe41fa96bdd0dd766f9b6f/latest.zip' --output "$archive"
        printf '%s  %s\n' "$DALAMUD_SHA256" "$archive" | sha256sum --check
        unzip -oq "$archive" -d "$RUNNER_TEMP/dalamud"
    - name: Set the library path
      shell: bash
      run: |
        test -f "$RUNNER_TEMP/dalamud/Lumina.dll"
        test -f "$RUNNER_TEMP/dalamud/Lumina.Excel.dll"
        test -f "$RUNNER_TEMP/dalamud/Microsoft.Extensions.ObjectPool.dll"
        printf 'DalamudLibPath=%s/dalamud/\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
